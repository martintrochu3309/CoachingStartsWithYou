<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- …/?dashboard opens the admin dashboard (admin/), which has its own sign-in and admin check. -->

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coaching Starts With You</title>
  <meta name="description" content="Coaching starts with you. Five honest questions, one action to improve.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coaching">
  <!-- Link preview in messages (iMessage, WhatsApp, Slack…). Most apps need a full https:// address for the image. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Coaching starts with you">
  <meta property="og:description" content="Five honest questions, one action to improve.">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="dx/fonts/magistral-bold-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="dx/fonts/nhd-light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="dx/dailyxcellence.css">
  <link rel="stylesheet" href="css/change-check.css">
</head>
<body class="dx">
  <main id="app" aria-live="polite"></main>
  <noscript>Coaching Starts With You needs JavaScript turned on.</noscript>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // Safety net: if the app didn't draw anything (e.g. an old saved copy mixed with new files), offer RELOAD
    // instead of a blank screen. RELOAD clears the saved copy of the app; checks saved in the account are safe.
    window.addEventListener("load", () => setTimeout(() => {
      const app = document.getElementById("app");
      if (!app || app.innerHTML.trim()) return;
      app.innerHTML = '<div style="max-width:480px;margin:0 auto;padding:40vh 24px 0;font-family:Arial,sans-serif;text-align:center">'
        + '<p style="font-size:17px;color:#111">Something went wrong loading the app.</p>'
        + '<button id="hardReload" style="margin-top:16px;height:52px;padding:0 32px;border:0;border-radius:26px;background:#111;color:#fff;font-weight:700;letter-spacing:.18em">RELOAD</button></div>';
      document.getElementById("hardReload").onclick = async () => {
        try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } catch (e) {}
        try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch (e) {}
        location.reload();
      };
    }, 2000));
  </script>
</body>
</html>
